<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIA Admin | Gestión de Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #080808; color: #fff; }
        .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .brand-gradient { background: linear-gradient(135deg, #E50914 0%, #B20710 100%); }
    </style>
</head>
<body class="bg-[#080808] text-white min-h-screen">
    <!-- Navbar Premium Admin -->
    <nav class="glass px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text brand-gradient">UIA<span class="text-white">ADMIN</span></h1>
            <div class="h-6 w-[1px] bg-white/10"></div>
            <span id="userNameDisplay" class="text-xs font-bold uppercase tracking-widest text-gray-500">Panel de Control</span>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="px-5 py-2 text-xs font-bold hover:text-brand-red transition-colors uppercase tracking-widest">Ver Sitio</a>
            <button id="logoutBtn" class="bg-white/5 hover:bg-white/10 px-5 py-2 rounded-full text-xs font-bold border border-white/10 transition-all">Desconectarse</button>
        </div>
    </nav>

    <main class="p-6 lg:p-12 max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6">
            <div>
                <h2 class="text-4xl font-black mb-2">Gestión de Catálogo</h2>
                <div class="flex items-center gap-2 text-gray-500 text-sm font-bold uppercase tracking-widest">
                    <span class="w-8 h-[2px] bg-brand-red"></span> Base de Datos en Tiempo Real
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <input type="text" id="adminSearchInput" placeholder="Buscar por título..." class="w-full sm:w-80 bg-white/5 border border-white/10 rounded-xl px-5 py-3 text-sm font-bold focus:border-brand-red outline-none transition-all">
                <button id="addMovieBtn" class="brand-gradient px-8 py-3 rounded-xl font-black text-sm shadow-2xl shadow-brand-red/20 hover:scale-105 transition-all whitespace-nowrap">
                    + AGREGAR PELÍCULA
                </button>
            </div>
        </header>

        <!-- Tabla de Películas Estilizada -->
        <div class="glass rounded-3xl overflow-hidden shadow-2xl border border-white/5">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-white/5 text-gray-500 font-black uppercase text-[10px] tracking-[0.2em] border-b border-white/5">
                            <th class="px-8 py-6">Visual</th>
                            <th class="px-8 py-6">Título e Información</th>
                            <th class="px-8 py-6">Año</th>
                            <th class="px-8 py-6">Duración</th>
                            <th class="px-8 py-6 text-right">Mantenimiento</th>
                        </tr>
                    </thead>
                    <tbody id="adminMoviesTable" class="divide-y divide-white/5">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
            
            <div id="tableLoading" class="py-32 flex flex-col items-center">
                <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-brand-red mb-6"></div>
                <p class="text-gray-500 font-bold uppercase tracking-widest text-xs">Sincronizando con SQL Server...</p>
            </div>
        </div>
    </main>

    <!-- Modal Premium -->
    <div id="movieModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="glass rounded-3xl max-w-xl w-full p-10 border border-white/10 shadow-2xl">
            <h2 class="text-3xl font-black mb-8 italic tracking-tighter">DETALLES DE PRODUCCIÓN</h2>
            <form id="movieForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">Título de la Obra</label>
                    <input type="text" id="mTitle" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-brand-red outline-none transition-all font-bold">
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">Año de Estreno</label>
                        <input type="number" id="mYear" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-brand-red outline-none transition-all font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">Duración (minutos)</label>
                        <input type="number" id="mDuration" required class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-brand-red outline-none transition-all font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">Sinopsis Ejecutiva</label>
                    <textarea id="mSynopsis" rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-brand-red outline-none transition-all font-medium leading-relaxed"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 mb-2 uppercase tracking-widest">Poster URL</label>
                    <input type="text" id="mPoster" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-brand-red outline-none transition-all font-bold" placeholder="https://image.tmdb.org/t/p/w500/...jpg (opcional)">
                </div>
                <div class="flex justify-end gap-6 mt-10">
                    <button type="button" id="closeModal" class="px-6 py-3 text-sm font-bold text-gray-500 hover:text-white transition-colors">DESCARTAR</button>
                    <button type="submit" class="brand-gradient px-10 py-4 rounded-xl font-black text-xs shadow-xl shadow-brand-red/20 transition-all">GUARDAR CAMBIOS</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
